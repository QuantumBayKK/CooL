name: CI

on:
  push:
    branches: [main, "rebuild/**"]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first. CI that keeps grinding
# through superseded commits burns minutes and delays the run people are
# actually waiting on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # ── static checks ────────────────────────────────────────────────────────
  # No database, no Docker. These are the fast gates, and they run first so a
  # typo does not wait behind a container pull.
  check:
    name: Types, guards and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Palette conformance (WCAG AA, both themes)
        run: npm run verify:palette

      # The claim guard. Fails the build if any page contains a phrase reserved
      # for a readiness gate above the one the product is actually on. This is
      # the check that stops the site over-selling itself, and it is not
      # optional or advisory.
      - name: Claim conformance
        run: npm run verify:claims

      - name: Unit and conformance tests
        run: npm test

  # ── secret scanning ──────────────────────────────────────────────────────
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret committed and then removed is still a
          # secret, and a shallow clone would not see it.
          fetch-depth: 0

      - name: Fail on committed env files
        run: |
          if git log --all --diff-filter=A --name-only --pretty=format: \
             | grep -E '^\.env($|\.)' | grep -v '\.env\.example'; then
            echo "::error::An environment file was committed. Rotate every value in it."
            exit 1
          fi
          echo "No env files in history."

      - name: Fail on service-role keys in tracked files
        run: |
          # Supabase service-role JWTs and secret keys. The anon/publishable key
          # is public by design and is deliberately not matched here.
          if git grep -nIE 'sb_secret_[A-Za-z0-9_-]{20,}|service_role' -- \
             ':!*.md' ':!.github/**' ':!.env.example' ':!scripts/**'; then
            echo "::error::A service-role reference appears in a tracked file."
            exit 1
          fi
          echo "No service-role keys in tracked files."

  # ── database ─────────────────────────────────────────────────────────────
  # Applies the migrations to a real Postgres and proves the security
  # properties the site claims. Separate job so a schema regression is
  # attributable at a glance.
  database:
    name: Schema and RLS conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Apply migrations and seed
        run: supabase db reset

      - name: Row-level security conformance
        env:
          # `supabase start` names containers after the working directory.
          SUPABASE_DB_CONTAINER: supabase_db_V2
        run: npm run verify:rls

  # ── build ────────────────────────────────────────────────────────────────
  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build
        # Deliberately built WITHOUT Supabase credentials. The public site must
        # compile and render for a contributor who has never run `supabase
        # start` — if this job needs secrets, the portal has leaked into the
        # public tree.
        env:
          INVESTOR_SESSION_SECRET: "ci-build-only-secret-not-used-at-runtime-x"
          ADMIN_SESSION_SECRET: "ci-build-only-admin-secret-not-used-at-run-x"
        run: npm run build
