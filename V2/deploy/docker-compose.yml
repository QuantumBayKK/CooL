# Deploy with:  phala deploy -c docker-compose.yml -n cool-evidence
#
# The only host-specific line is the socket mount. Everything above it is an
# ordinary container — which is dstack's whole argument, and ours: the evidence
# engine is not TEE-aware code, it is normal code running somewhere measurable.

services:
  evidence-plane:
    build: .
    image: ghcr.io/northwindcipher/cool-evidence:2.4.0
    restart: always
    environment:
      # The guest agent inside the CVM. `fetch` cannot open a unix socket, so
      # CooL routes this through node:http — see src/lib/cool/phala/unix.ts.
      - DSTACK_ENDPOINT=/var/run/dstack.sock
      # The step that turns `attestation` from simulated into pass: something
      # that chains the quote to Intel's root rather than to ours.
      - QUOTE_VERIFIER_URL=${QUOTE_VERIFIER_URL:-https://api.phala.network/attest/verify}
      - QUOTE_VERIFIER_KEY=${QUOTE_VERIFIER_KEY:-}
      - COOL_ENV=prod
      # Pin the image you reviewed. Until this is set, a quote proves "some TEE"
      # rather than "the code we approved".
      - COOL_PIN_MRTD=${COOL_PIN_MRTD:-}
      - COOL_PIN_RTMR0=${COOL_PIN_RTMR0:-}
      - COOL_PIN_RTMR1=${COOL_PIN_RTMR1:-}
      - COOL_PIN_RTMR2=${COOL_PIN_RTMR2:-}
      - COOL_PIN_RTMR3=${COOL_PIN_RTMR3:-}
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - evidence:/evidence

  # The console, serving the same evidence from inside the same enclave.
  #
  # Separate service, same volume: the plane keeps sealing whether or not anyone
  # is looking, and the console is a reader that can be restarted, scaled to
  # zero, or left off entirely without touching the evidence. It binds 0.0.0.0
  # because the only route to it is dstack-gateway, which terminates TLS with a
  # certificate bound to this CVM's own measurement — the port is not open to
  # the internet, it is open to the gateway.
  #
  # Turning this on means setting `gateway_enabled: true` in app-compose.json.
  console:
    build: .
    image: ghcr.io/northwindcipher/cool-evidence:2.4.0
    restart: always
    depends_on:
      - evidence-plane
    environment:
      - DSTACK_ENDPOINT=/var/run/dstack.sock
      - QUOTE_VERIFIER_URL=${QUOTE_VERIFIER_URL:-https://api.phala.network/attest/verify}
      - QUOTE_VERIFIER_KEY=${QUOTE_VERIFIER_KEY:-}
      - COOL_ENV=prod
      - COOL_PIN_MRTD=${COOL_PIN_MRTD:-}
      - COOL_PIN_RTMR3=${COOL_PIN_RTMR3:-}
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - evidence:/evidence
    ports:
      - "4319:4319"
    command: ["cool", "ui", "/evidence", "--host", "0.0.0.0", "--no-open"]

volumes:
  evidence:
